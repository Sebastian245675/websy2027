# URL canónica de cada pedido a websysrl.com. Va en el contexto http (por ejemplo en conf.d/, al lado de
# websysrl-proxy.conf), porque "map" no se puede declarar dentro de un server.
#
# $websy_canonical_path = la ruta que debería tener la URL pedida:
#   /planes/                -> /planes          (formato único: sin barra final)
#   /blog/index.html        -> /blog
#   /index.html             -> /
#   slug viejo del blog     -> slug actual      (lista de abajo)
# websysrl-proxy.conf redirige con 301 cuando difiere de la ruta pedida, en un solo salto.

# Los slugs del blog superan los 64 caracteres del valor por defecto: sin esto, "nginx -t" falla con
# "could not build map_hash". Si el nginx.conf del servidor ya define map_hash_bucket_size, dejar el mayor.
map_hash_bucket_size 128;

map $uri $websy_clean_path {
    default                                  $uri;
    /index.html                              /;
    ~^(?<websy_index_dir>/.+)/index\.html$   $websy_index_dir;
    ~^(?<websy_no_slash>/.+?)/+$             $websy_no_slash;
}

# Slugs que cambiaron o se unificaron. Al agregar una línea: ruta vieja (sin barra final) -> ruta nueva.
map $websy_clean_path $websy_moved_path {
    default "";
    # Posts unificados por duplicados (se conserva el más establecido o el más completo)
    /blog/cuanto-cuesta-una-pagina-web-para-mi-negocio-precios-reales     /blog/cuanto-cuesta-pagina-web-argentina-2026;
    /blog/cuanto-cuesta-desarrollar-una-aplicacion-movil-precios-reales   /blog/cuanto-cuesta-desarrollar-una-app-movil-argentina-latam;
    /blog/wordpress-vs-react-cual-es-mejor-para-mi-pagina-web             /blog/desarrollo-web-react-vs-wordpress-guia-comparativa;
    # URLs que Google conoce de versiones anteriores del sitio (no existen en el código actual)
    /blog/seo-empresas-salta-como-aparecer-en-google                      /blog/como-posicionar-mi-negocio-local-en-google-seo-local;
    /blog/landing-pages-que-convierten-7-elementos-esenciales              /blog/landing-page-que-es-y-como-crear-una-que-convierta-clientes;
    # Páginas locales viejas: van a la landing de Salta
    /desarrollo-web-salta.html                                            /servicios/desarrollo-web;
    /desarrollo-web-salta                                                 /diseno-web-salta;
    /diseno-web-en-salta                                                  /diseno-web-salta;
    # URLs viejas que Search Console seguía mostrando con impresiones (export del 2026-10-15)
    /blog/que-es-un-crm-por-que-tu-empresa-lo-necesita                    /blog/que-es-un-crm-y-como-ayuda-a-vender-mas-a-mi-empresa;
    /blog/inteligencia-artificial-pymes-herramientas-automatizaciones     /blog/que-es-inteligencia-artificial-y-como-puede-ayudar-a-mi-empresa;
    /blog/diseno-web-profesional-vs-wordpress-cual-elegir                 /blog/desarrollo-web-react-vs-wordpress-guia-comparativa;
    /blog/publicar-app-en-app-store-google-play-guia-paso-a-paso          /blog/publicar-app-app-store-google-play-guia-paso-a-paso;
    /automatizaciones-ia-salta.html                                       /servicios/automatizaciones-ia;
    /tiendas-online-salta.html                                            /servicios/ecommerce;
    # Servicio de diseño: el slug que enlazaban los posts viejos
    /servicios/diseno-ux-ui                                               /servicios/ui-ux;
}

map $websy_moved_path $websy_canonical_path {
    ""      $websy_clean_path;
    default $websy_moved_path;
}
