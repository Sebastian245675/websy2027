# nginx del contenedor que sirve build/ (websysrl_site). Reemplaza su default.conf, por ejemplo:
#   /etc/nginx/conf.d/default.conf  con  root = carpeta donde se copia build/
#
# Cada ruta del sitio está prerenderizada por react-snap como <ruta>/index.html, así que nginx sirve
# solo lo que existe. Lo demás recibe un 404 HTTP real con build/404.html (noindex), en lugar de
# la plantilla de la home con estado 200, que Google marcaba como soft 404 o como duplicado de la home.
# Las redirecciones (barra final, sin www, slugs viejos) las hace el proxy: websysrl-proxy.conf.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;

    # Compresión: sin esto el HTML (~125 KB) y el JS viajan sin comprimir y el LCP en celular sufre.
    # text/html se comprime siempre que gzip esté activo.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;
    location = /404.html { internal; }
    # Plantilla sin prerenderizar que genera react-snap: solo para el panel interno
    location = /200.html { internal; }

    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imágenes y fuentes de public/ (sin hash en el nombre): un mes
    location ~* \.(webp|avif|png|jpe?g|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
    }

    # Panel interno de cotizaciones: no se prerenderiza, lo arma React sobre la plantilla
    location = /panel-cotizaciones {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /200.html =404;
    }

    # Primero el HTML prerenderizado (evita que nginx redirija /servicios a /servicios/), después archivos
    # El HTML se revalida en cada visita: cambia en cada deploy (los /static/ llevan hash y sí se cachean 1 año)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }
}
