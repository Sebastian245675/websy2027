# Ajustes de nginx para www.websysrl.com (el sitio corre en nginx, no en Apache).
# Después de editar el config del servidor: sudo nginx -t && sudo systemctl reload nginx

# 1) Punto 23: redirección 301 de websysrl.com (sin www) y de http a https://www.websysrl.com
#    Quitar "websysrl.com" del server_name del bloque principal.
server {
    listen 80;
    listen [::]:80;
    server_name websysrl.com www.websysrl.com;
    return 301 https://www.websysrl.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name websysrl.com;

    # Mismos certificados que usa el bloque de www (tienen que cubrir websysrl.com)
    ssl_certificate     /etc/letsencrypt/live/websysrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websysrl.com/privkey.pem;

    return 301 https://www.websysrl.com$request_uri;
}

# 2) Punto 24: dentro del bloque principal (server_name www.websysrl.com), reemplazar el location / por esto.
#    Hoy /servicios redirige a http://www.websysrl.com/servicios/ y de ahí a https (2 redirecciones,
#    ~1,5 s extra en celular según Lighthouse) y la URL canónica sin barra nunca responde 200.
#    react-snap genera /servicios/index.html, así que se sirve directo sin redirigir:
#
#    absolute_redirect off;
#    http2 on;               # Lighthouse marcó 18-22 recursos sin HTTP/2
#
#    location / {
#        # Probar primero el HTML prerenderizado evita que nginx redirija el
#        # directorio (por ejemplo /servicios) a una URL con barra final.
#        try_files $uri/index.html $uri /index.html;
#    }

# Verificar:
#   curl -sI https://websysrl.com/              ->  301 + Location: https://www.websysrl.com/
#   curl -sI https://www.websysrl.com/servicios ->  200 (sin Location)
