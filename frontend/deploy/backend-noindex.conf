# backend.websysrl.com aparece en Google como soft 404 (la raíz responde 200 con "Hello World!").
# La config de ese servidor NO está en este repo: pegar estas líneas dentro del bloque
#   server { server_name backend.websysrl.com; ... }
# que ya existe en el nginx del proxy, sin tocar su location / con el proxy_pass a Express.
# Los formularios del sitio (POST /api/public/forms/...) siguen funcionando igual.
# Después: sudo nginx -t && sudo systemctl reload nginx

    # Ninguna respuesta del backend se indexa (cabecera, sirve también para JSON y archivos)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # robots.txt propio: no rastrear nada
    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow" always;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # La raíz no es una página: 404 en lugar de "Hello World!" con 200
    location = / {
        return 404;
    }

# Verificar:
#   curl -sI https://backend.websysrl.com/            -> 404 + X-Robots-Tag: noindex, nofollow
#   curl -s  https://backend.websysrl.com/robots.txt  -> Disallow: /
#   El formulario de /contacto sigue enviando bien.
# Después, en Search Console: Eliminaciones > Nueva solicitud > https://backend.websysrl.com/
# (si backend.websysrl.com está dentro de una propiedad de dominio websysrl.com).
