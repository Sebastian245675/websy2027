# Proxy de entrada de websysrl.com. Requiere websysrl-redirects.conf (define $websy_canonical_path).
# Después de editar: sudo nginx -t && sudo systemctl reload nginx (o reiniciar el contenedor del proxy).
#
# Todas las variantes llegan a la URL canónica con UNA sola redirección 301:
#   http://websysrl.com/planes/  -> https://www.websysrl.com/planes
#   https://websysrl.com/blog    -> https://www.websysrl.com/blog
#   https://www.websysrl.com/blog/index.html -> https://www.websysrl.com/blog

server {
    listen 80;
    listen [::]:80;
    server_name websysrl.com www.websysrl.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.websysrl.com$websy_canonical_path$is_args$args;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name websysrl.com;

    ssl_certificate /etc/letsencrypt/live/websysrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websysrl.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.websysrl.com$websy_canonical_path$is_args$args;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.websysrl.com;

    ssl_certificate /etc/letsencrypt/live/websysrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websysrl.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Barra final, /index.html o slug viejo: 301 a la URL canónica (conserva ?utm y demás parámetros)
    if ($websy_canonical_path != $uri) {
        return 301 https://www.websysrl.com$websy_canonical_path$is_args$args;
    }

    rewrite ^/(.+)/$ /$1 permanent;

    # API de consultas (leads-api: formularios, clics a WhatsApp y panel), en el contenedor websysrl_leads_api.
    # Con variable + resolver de Docker, nginx arranca aunque la API esté caída (el nombre se resuelve en
    # cada pedido) y responde 502 solo en /api/.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $websy_leads_api http://websysrl_leads_api:4100;
        proxy_pass $websy_leads_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Sincronización de los servidores de campaña (con token): lotes grandes con los textos de cada mensaje.
    # Los formularios públicos siguen con el límite de 64k de /api/.
    location /api/outreach/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $websy_leads_api http://websysrl_leads_api:4100;
        proxy_pass $websy_leads_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://websysrl_site:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
