server {
    listen 80;
    listen [::]:80;
    server_name websysrl.com www.websysrl.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.websysrl.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name websysrl.com;

    ssl_certificate /etc/letsencrypt/live/websysrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websysrl.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.websysrl.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.websysrl.com;

    ssl_certificate /etc/letsencrypt/live/websysrl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/websysrl.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Artículos duplicados del blog unificados (2026-10-07): 301 al artículo que se conserva
    location = /blog/cuanto-cuesta-una-pagina-web-para-mi-negocio-precios-reales {
        return 301 https://www.websysrl.com/blog/cuanto-cuesta-pagina-web-argentina-2026;
    }
    location = /blog/cuanto-cuesta-desarrollar-una-app-movil-argentina-latam {
        return 301 https://www.websysrl.com/blog/cuanto-cuesta-desarrollar-una-aplicacion-movil-precios-reales;
    }
    location = /blog/wordpress-vs-react-cual-es-mejor-para-mi-pagina-web {
        return 301 https://www.websysrl.com/blog/desarrollo-web-react-vs-wordpress-guia-comparativa;
    }

    location / {
        proxy_pass http://websysrl_site:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
