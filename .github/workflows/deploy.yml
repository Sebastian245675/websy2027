# Publica websysrl.com en el servidor cada vez que se sube código a main (o a mano desde la pestaña Actions).
# Hace lo mismo que `npm run deploy` desde una PC: compila y prerenderiza, sube el release y la API de consultas
# por SSH, cambia de versión con vuelta atrás automática si nginx falla, y verifica el sitio en vivo.
#
# Secretos del repositorio (Settings > Secrets and variables > Actions):
#   DEPLOY_SSH_KEY      clave privada "websy-github-actions" (su pública está autorizada en el servidor)
#   DEPLOY_KNOWN_HOSTS  huella del servidor 2.24.100.82 (salida de ssh-keyscan)
name: Desplegar websysrl.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues a la vez: el segundo espera a que termine el primero
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Librerías del navegador que usa el prerender (react-snap)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgbm1 libnss3 libxss1 libasound2 libatk-bridge2.0-0 libgtk-3-0 libgconf-2-4

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y prerenderizar
        run: npm run build

      - name: Clave SSH del servidor
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Publicar en el servidor
        run: node scripts/deploy-production.js

      - name: Verificar el sitio en vivo
        run: node scripts/verify-seo.js --sitemap=live --verbose

      - name: Avisar a Bing de las páginas cambiadas (IndexNow)
        run: node scripts/indexnow.js
        continue-on-error: true
